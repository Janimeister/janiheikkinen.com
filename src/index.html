    <script>
      // The language toggle remembers its last choice. A visitor who chose Finnish and opens an
      // English address goes to the same page in Finnish, before anything is drawn.
      try {
        if (
          localStorage.getItem('app-language') === 'fi' &&
          !/^\/fi(\/|$)/.test(location.pathname)
        ) {
          var path = location.pathname.replace(/\/+$/, '');
          location.replace('/fi' + (path || '/') + location.search + location.hash);
        }
      } catch (e) {
        // No storage, no remembered choice.
      }
    </script>
