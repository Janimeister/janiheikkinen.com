version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Angular framework + toolchain must upgrade in lockstep (strict peer deps).
      # Listed first: a dependency joins the first group it matches.
      angular:
        patterns:
          - "@angular/*"
      dev-dependencies:
        dependency-type: development
    ignore:
      # The Angular 22 toolchain pins `peer typescript@">=6.0 <6.1"`, so both
      # major and minor TypeScript bumps break `npm ci`. Only patches are safe;
      # `ng update` moves TypeScript as part of the Angular upgrade itself.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
