name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      called-from-deploy:
        description: Set to true when called from the deploy workflow to prevent cancelling in-flight deploys
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ inputs['called-from-deploy'] && 'deploy-tests' || format('tests-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs['called-from-deploy'] }}

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium for the production smoke test
        run: bash scripts/install-playwright.sh chromium

      - name: Smoke test the Pages artifact
        run: npm run test:production

      - name: Upload production smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-build
          path: playwright-production-report/
          if-no-files-found: ignore
          retention-days: 7


  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-browsers:
    name: E2E & Accessibility Tests (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Install Playwright browsers
        run: bash scripts/install-playwright.sh ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E & Accessibility Tests
    needs: e2e-browsers
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser to pass
        env:
          BROWSER_RESULT: ${{ needs.e2e-browsers.result }}
        run: test "$BROWSER_RESULT" = success
