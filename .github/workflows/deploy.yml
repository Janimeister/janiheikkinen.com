name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    with:
      called-from-deploy: true
    permissions:
      contents: read

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORSSISAHKO_WORKER_URL: ${{ vars.PORSSISAHKO_WORKER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Generate production environment file
        shell: bash
        run: |
          node <<'EOF'
          const { writeFileSync } = require('node:fs');

          const workerUrl = process.env.PORSSISAHKO_WORKER_URL;
          if (!workerUrl) {
            throw new Error('PORSSISAHKO_WORKER_URL repository variable is required.');
          }

          writeFileSync(
            'src/environments/environment.prod.ts',
            `export const environment = {\n  workerUrl: ${JSON.stringify(workerUrl)}\n};\n`
          );
          EOF

      - name: Build
        run: npm run build -- --base-href /

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/janiheikkinen-com/browser/index.html dist/janiheikkinen-com/browser/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/janiheikkinen-com/browser

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
