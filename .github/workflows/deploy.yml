name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    with:
      called-from-deploy: true
    permissions:
      contents: read

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORSSISAHKO_WORKER_URL: ${{ vars.PORSSISAHKO_WORKER_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # --legacy-peer-deps needed due to @analogjs/vite-plugin-angular peer dep version ranges
      - run: npm ci --legacy-peer-deps

      - name: Generate production environment file
        shell: bash
        run: |
          node <<'EOF'
          const { writeFileSync } = require('node:fs');

          const workerUrl = process.env.PORSSISAHKO_WORKER_URL;
          if (!workerUrl) {
            throw new Error('PORSSISAHKO_WORKER_URL repository variable is required.');
          }

          writeFileSync(
            'src/environments/environment.prod.ts',
            `export const environment = {\n  workerUrl: ${JSON.stringify(workerUrl)}\n};\n`
          );
          EOF

      - name: Build
        run: npm run build -- --base-href /

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/janiheikkinen-com/browser/index.html dist/janiheikkinen-com/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/janiheikkinen-com/browser

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
