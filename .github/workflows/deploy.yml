name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['Tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PORSSISAHKO_WORKER_URL: ${{ vars.PORSSISAHKO_WORKER_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # --legacy-peer-deps needed due to @analogjs/vite-plugin-angular peer dep version ranges
      - run: npm ci --legacy-peer-deps

      - name: Generate production environment file
        run: |
          echo "export const environment = { workerUrl: '${PORSSISAHKO_WORKER_URL}' };" > src/environments/environment.prod.ts

      - run: npx ng build --base-href /

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/janiheikkinen-com/browser/index.html dist/janiheikkinen-com/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/janiheikkinen-com/browser

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
